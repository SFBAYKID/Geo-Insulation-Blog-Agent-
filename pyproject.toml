[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-insulation-blog-agent"
version = "0.1.0"
description = "Geo Insulation Blog Agent: research-backed drafts for geo-insulation.com with Slack review"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40,<1", "slack-bolt>=1.20,<2", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "pydantic-settings>=2.2,<3", "PyYAML>=6,<7", "APScheduler>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.8", "mypy==2.3.1", "types-PyYAML", "types-requests"]

[tool.setuptools.packages.find]
include = ["geo_blog*"]

[tool.setuptools.package-data]
geo_blog = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
check_untyped_defs = true
files = ["geo_blog"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
